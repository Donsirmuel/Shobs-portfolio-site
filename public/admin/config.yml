backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/data/cms/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Category", name: "category", widget: "select", options: ["Logo Design", "Branding & Identity", "Print Design", "Mockups & Packaging", "Illustration"] }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Images", name: "images", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Challenge", name: "challenge", widget: "text" }
      - { label: "Process", name: "process", widget: "text" }
      - { label: "Outcome", name: "outcome", widget: "text" }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/data/cms/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Content", name: "content", widget: "markdown" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Author", name: "author", widget: "string", default: "Shobs Creations" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }

  - name: "testimonials"
    label: "Testimonials"
    folder: "src/data/cms/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Client Name", name: "name", widget: "string" }
      - { label: "Role/Company", name: "role", widget: "string" }
      - { label: "Testimonial", name: "content", widget: "text" }
      - { label: "Avatar", name: "avatar", widget: "image" }
      - { label: "Rating", name: "rating", widget: "number", default: 5, min: 1, max: 5 }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "siteInfo"
        label: "Site Information"
        file: "src/data/siteInfo.js"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "WhatsApp Link", name: "whatsapp", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Behance", name: "behance", widget: "string" }
